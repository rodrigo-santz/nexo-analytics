name: Atualizar dados da NEXO

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'data/streamers.json'
      - 'data/streamers-archived.json'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nexo-analytics-publish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar regras
        run: npm test
      - name: Reconciliar subscriptions EventSub
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_WEBHOOK_URL: ${{ secrets.TWITCH_WEBHOOK_URL }}
          TWITCH_EVENTSUB_SECRET: ${{ secrets.TWITCH_EVENTSUB_SECRET }}
        run: node scripts/sync-subscriptions.mjs
      - name: Verificar saude e recuperar estados observaveis
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_WEBHOOK_URL: ${{ secrets.TWITCH_WEBHOOK_URL }}
        run: node scripts/watchdog.mjs
      - name: Coletar presenca estimada de membros nas lives
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_CHATTERS_TOKEN: ${{ secrets.TWITCH_CHATTERS_TOKEN }}
          TWITCH_CHATTERS_MODERATOR_ID: ${{ secrets.TWITCH_CHATTERS_MODERATOR_ID }}
        run: node scripts/chatters.mjs
      - name: Consolidar dados em JSON
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          node scripts/sync-profiles.mjs
          node scripts/aggregate.mjs
      - name: Persistir paineis e monitoramento no repositorio
        shell: bash
        run: |
          git config user.name "nexo-analytics[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/streamer-profiles.json data/health/status.json data/health/subscriptions.json data/events/
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar estatisticas da NEXO"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep 2
            done
      - name: Preparar site estatico
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp data/dashboard.json _site/data/dashboard.json
          cp data/streamer-profiles.json _site/data/streamer-profiles.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar interface do painel
        uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
      - name: Repetir publicacao do painel
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
          fi
