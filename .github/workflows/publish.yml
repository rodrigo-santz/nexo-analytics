name: Atualizar dados e publicar painel
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/streamers.json'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nexo-analytics-publish
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar regras
        run: npm test
      - name: Verificar saúde e recuperar estados observáveis
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_WEBHOOK_URL: ${{ secrets.TWITCH_WEBHOOK_URL }}
        run: node scripts/watchdog.mjs
      - name: Consolidar dados em JSON
        run: node scripts/aggregate.mjs
      - name: Persistir painéis e monitoramento no repositório
        shell: bash
        run: |
          git config user.name "nexo-analytics[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/health/status.json data/events/
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar estatísticas da NEXO [skip ci]"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep 2
            done
          fi
      - name: Preparar site estático
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp data/dashboard.json _site/data/dashboard.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
