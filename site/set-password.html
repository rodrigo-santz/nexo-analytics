<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090612" /><meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Criar senha | NEXO Analytics</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><script>document.documentElement.classList.add('auth-pending');</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=supabase-auth-1" />
</head>
<body class="login-page">
  <main class="login-screen" aria-label="Criar senha NEXO Analytics">
    <div class="login-orbit login-orbit-one" aria-hidden="true"></div><div class="login-orbit login-orbit-two" aria-hidden="true"></div>
    <section class="login-card">
      <img src="./assets/nexo-logo.png" alt="Nexo Synergy" class="login-logo" /><div class="login-rule" aria-hidden="true"></div>
      <p class="login-kicker">PRIMEIRO ACESSO / ANALYTICS</p>
      <form id="passwordForm" class="login-form" novalidate>
        <label for="newPassword">NOVA SENHA</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="Crie sua senha" minlength="8" required />
        <label for="confirmPassword">CONFIRMAR SENHA</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Repita sua senha" minlength="8" required />
        <p class="login-feedback" id="passwordFeedback" role="alert" aria-live="polite"></p>
        <button type="submit" class="login-submit">SALVAR SENHA <span aria-hidden="true">↗</span></button>
      </form>
    </section>
  </main>
  <script src="./set-password.js?v=supabase-auth-1" type="module"></script>
</body>
</html>
